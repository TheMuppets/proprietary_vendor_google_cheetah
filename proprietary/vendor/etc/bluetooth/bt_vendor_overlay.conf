# This is BTBCM HAL overlay configuration file.

# Uart port name
UartPort = /dev/ttySAC18

# Sar backOff high resolution support
SarBackOffHighResolution = true

# Update BQR Event Mask property value
BqrEventMaskValueUpdate = 262238

BtA2dpOffloadCap = sbc-aac-aptx-aptxhd-ldac-opus

BtOpusEnabled = true

# Silent recover unimplement type packet when no device connected
SilentRecoverUnimplementedPacket = true

# Skip unimplemented type packets as a workaround (b/409428475)
SkipUnimplementedPacket = true
